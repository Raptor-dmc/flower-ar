
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flower Bouquet 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f7f4;
      color: #222;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: #eeece7;
      border-radius: 16px;
    }

    button {
      padding: 12px 24px;
      margin: 16px;
      border: none;
      border-radius: 24px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Flower Bouquet</h1>
  <p>หมุนดูช่อดอกไม้ 3D ได้เลย</p>

  <model-viewer
    id="flower"
    src="./flower-bouquet.glb"
    ios-src="./flower-bouquet.usdz"
    alt="ช่อดอกไม้หลากสี"
    camera-controls
    auto-rotate
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-placement="floor"
    shadow-intensity="1">
  </model-viewer>

  <button onclick="document.querySelector('#flower').activateAR()">
    ดูดอกไม้ในพื้นที่จริง (AR)
  </button>
</body>
</html>
